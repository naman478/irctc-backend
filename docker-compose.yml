name: irctc_backend

services:
  postgres:
    image: postgres:15
    container_name: irctc_postgres
    restart: always
    environment:
      POSTGRES_USER: irctc_user
      POSTGRES_PASSWORD: irctc_password
      POSTGRES_DB: irctc_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: irctc_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: irctc_admin@example.com
      PGADMIN_DEFAULT_PASSWORD: irctc_admin_password
    ports:
      - "8080:80"
    depends_on:
      - postgres

  redis:
    image: redis:7
    container_name: irctc_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass irctc_redis_password
    volumes:
      - redis_data:/data

  redis_insight:
    image: redis/redisinsight:latest
    container_name: irctc_redis_insight
    restart: always
    ports:
      - "8081:5540"
    environment:
      - RI_APP_EULA_ACCEPT=true

volumes:
  postgres_data:
  redis_data: